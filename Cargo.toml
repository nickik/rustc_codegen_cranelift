[package]
name = "rustc_codegen_cranelift"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
# SIA32 bring-up uses the matching Cranelift fork and its target-lexicon fork.
# Keep these dependencies on the same git revision/source so Triple/Architecture
# types are identical across cg_clif and cranelift-codegen.
cranelift-codegen = { git = "https://github.com/nickik/crainlift.git", branch = "sia32-backend", default-features = false, features = ["std", "timing", "unwind", "sia32"] }
cranelift-frontend = { git = "https://github.com/nickik/crainlift.git", branch = "sia32-backend" }
cranelift-module = { git = "https://github.com/nickik/crainlift.git", branch = "sia32-backend" }
cranelift-native = { git = "https://github.com/nickik/crainlift.git", branch = "sia32-backend" }
cranelift-jit = { git = "https://github.com/nickik/crainlift.git", branch = "sia32-backend", optional = true }
cranelift-object = { git = "https://github.com/nickik/crainlift.git", branch = "sia32-backend", default-features = false }
target-lexicon = { git = "https://github.com/nickik/crainlift.git", branch = "sia32-backend", package = "target-lexicon" }
gimli = { version = "0.33", default-features = false, features = ["write"] }
object = { version = "0.39.1", default-features = false, features = ["std", "read_core", "write", "archive", "coff", "elf", "macho", "pe"] }

indexmap = "2.0.0"
libloading = { version = "0.9.0", optional = true }
smallvec = "1.8.1"

[features]
# Enable features not ready to be enabled when compiling as part of rustc
unstable-features = ["jit", "inline_asm_sym"]
jit = ["cranelift-jit", "libloading"]
inline_asm_sym = []
unwinding = [] # Not yet included in unstable-features for performance reasons

[package.metadata.rust-analyzer]
rustc_private = true
