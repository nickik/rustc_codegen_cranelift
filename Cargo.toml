[package]
name = "rustc_codegen_cranelift"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
# SIA32 bring-up uses the matching Cranelift fork and its target-lexicon fork.
# Keep these dependencies on one immutable source snapshot so Triple/Architecture
# types and the backend stay reproducible across cg_clif and Cranelift.
cranelift-codegen = { git = "https://github.com/nickik/crainlift.git", rev = "12a7acb0084f85ba3d5ed14aa8c4575a520c4f5e", default-features = false, features = ["std", "timing", "unwind", "sia32"] }
cranelift-frontend = { git = "https://github.com/nickik/crainlift.git", rev = "12a7acb0084f85ba3d5ed14aa8c4575a520c4f5e" }
cranelift-module = { git = "https://github.com/nickik/crainlift.git", rev = "12a7acb0084f85ba3d5ed14aa8c4575a520c4f5e" }
cranelift-native = { git = "https://github.com/nickik/crainlift.git", rev = "12a7acb0084f85ba3d5ed14aa8c4575a520c4f5e" }
# JIT is not part of the SIA R0 goal. Keep the upstream optional dependency so
# the feature remains well-formed, but don't enable it through unstable-features.
cranelift-jit = { version = "0.135.0", optional = true }
cranelift-object = { git = "https://github.com/nickik/crainlift.git", rev = "12a7acb0084f85ba3d5ed14aa8c4575a520c4f5e", default-features = false }
target-lexicon = { git = "https://github.com/nickik/crainlift.git", rev = "12a7acb0084f85ba3d5ed14aa8c4575a520c4f5e", package = "target-lexicon" }
gimli = { version = "0.33", default-features = false, features = ["write"] }
# Match the object API used by the retained Cranelift 0.137 source.
object = { version = "0.40.0", default-features = false, features = ["std", "read_core", "write", "archive", "coff", "elf", "macho", "pe"] }

indexmap = "2.0.0"
libloading = { version = "0.9.0", optional = true }
smallvec = "1.8.1"

[features]
# For SIA R0, do not pull in cg_clif's JIT path. Native AOT object generation
# is the acceptance path we need for Lighting.
unstable-features = ["inline_asm_sym"]
jit = ["cranelift-jit", "libloading"]
inline_asm_sym = []
unwinding = [] # Not yet included in unstable-features for performance reasons

[package.metadata.rust-analyzer]
rustc_private = true
